services:
  postgres:
    image: postgres:16-alpine
    container_name: ananya-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ananya}
      POSTGRES_USER: ${POSTGRES_USER:-ananya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ananya_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - ananya_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - ananya-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ananya} -d ${POSTGRES_DB:-ananya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ananya-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ananya_dev_redis_data:/data
    networks:
      - ananya-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ananya-dev-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ananya.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - ananya_dev_pgadmin_data:/var/lib/pgadmin
    networks:
      - ananya-dev-network

volumes:
  ananya_dev_postgres_data:
  ananya_dev_redis_data:
  ananya_dev_pgadmin_data:

networks:
  ananya-dev-network:
    driver: bridge
