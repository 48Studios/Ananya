# ==============================================================================
# Ananya ERP — Production Image Override (compose.prod.yml)
# Provides GHCR image references for all application services.
# Use with compose.yml to run published production images:
#
#   docker compose -f compose.yml -f compose.prod.yml pull
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# Pin a specific release:
#   ANANYA_VERSION=sha-a1b2c3d docker compose -f compose.yml -f compose.prod.yml up -d
# ==============================================================================

services:
  api:
    image: ghcr.io/48studios/ananya-api:${ANANYA_VERSION:-latest}

  worker:
    image: ghcr.io/48studios/ananya-worker:${ANANYA_VERSION:-latest}

  web:
    image: ghcr.io/48studios/ananya-web:${ANANYA_VERSION:-latest}
