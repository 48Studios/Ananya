# ==============================================================================
# Ananya ML — Declarative Source Registry (`sources.yaml`)
#
# Production-isolated, policy-compliant source registry for automated public
# data collection across generalized ERP product intelligence domains.
#
# Groups:
# 1. General product catalogs
# 2. Manufacturers
# 3. Distributors
# 4. Tools
# 5. Mechanical
# 6. Electrical
# 7. Electronics
# 8. 3D printing
# 9. Industrial
# 10. Raw materials
# 11. Packaging
#
# Constraints & Guidelines:
# - All sources MUST have strict domain boundaries (no uncontrolled crawling).
# - Strict robots.txt compliance and per-domain rate limiting are enforced.
# - Do not bypass CAPTCHAs, paywalls, or authentication barriers.
# ==============================================================================

sources:

  # ----------------------------------------------------------------------------
  # 1. GENERAL PRODUCT CATALOGS
  # ----------------------------------------------------------------------------
  - id: openbuilds-catalog
    name: OpenBuilds Modular Systems & Hardware
    group: general_product_catalogs
    type: catalog
    source_quality: distributor
    enabled: true
    domains:
      - openbuilds.com
      - openbuildspartstore.com
    start_urls:
      - https://openbuildspartstore.com/sitemap.xml
      - https://openbuildspartstore.com/linear-rails/
    discovery:
      - sitemap
      - product_pages
    rate_limit:
      requests_per_second: 1.0
      delay_seconds: 1.0
      max_concurrent: 1
    max_file_size_mb: 15.0
    allowed_content_types:
      - text/html
      - application/pdf
      - application/json
    max_depth: 3
    max_pages: 300
    max_files: 100
    default_domain: mechanical

  - id: oshwa-hardware-registry
    name: Open Source Hardware Association Registry
    group: general_product_catalogs
    type: public_dataset
    source_quality: public_dataset
    enabled: true
    domains:
      - certification.oshwa.org
    start_urls:
      - https://certification.oshwa.org/api/projects.json
      - https://certification.oshwa.org/list.html
    discovery:
      - catalog
      - product_pages
    rate_limit:
      requests_per_second: 0.5
      delay_seconds: 2.0
      max_concurrent: 1
    max_file_size_mb: 20.0
    allowed_content_types:
      - text/html
      - application/json
    max_depth: 2
    max_pages: 200
    max_files: 50
    default_domain: electronics

