# ==============================================================================
# Ananya ERP — Base Stack (compose.yml)
# Contains shared infrastructure and common application service configuration.
# Must be composed with an override file that provides build or image directives:
#
#   Local build:     docker compose -f compose.yml -f compose.local.yml up --build
#   Published image: docker compose -f compose.yml -f compose.prod.yml up
#   Migrations:      docker compose -f compose.yml -f <override>.yml run --rm migrate
#
# Architecture:
#   Browser → https://erp.<domain>        (Next.js Web, port 3000)
#   Browser → https://api.erp.<domain>    (NestJS API, port 4000)
#   Docker service names are internal only; browser-facing API URLs must be public.
# ==============================================================================

name: ananya

services:
  db:
    image: postgres:16-alpine
    container_name: ananya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ananya}
      POSTGRES_USER: ${POSTGRES_USER:-ananya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ananya_secure_password}
    volumes:
      - ananya_db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ananya} -d ${POSTGRES_DB:-ananya}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: ananya-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ananya}:${POSTGRES_PASSWORD:-ananya_secure_password}@db:5432/${POSTGRES_DB:-ananya}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-ananya_jwt_production_secret_change_me}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:5001}
      ML_SERVICE_ENABLED: ${ML_SERVICE_ENABLED:-true}
    volumes:
      - ananya_app:/app/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    container_name: ananya-migrate
    restart: "no"
    command: ["node", "packages/database/dist/setup/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ananya}:${POSTGRES_PASSWORD:-ananya_secure_password}@db:5432/${POSTGRES_DB:-ananya}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  worker:
    container_name: ananya-worker
    restart: unless-stopped
    profiles:
      - worker
      - all
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ananya}:${POSTGRES_PASSWORD:-ananya_secure_password}@db:5432/${POSTGRES_DB:-ananya}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    volumes:
      - ananya_app:/app/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    container_name: ananya-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Public API URL generated dynamically at container boot via runtime-config.js.
      # The browser communicates directly with this endpoint.
      # Docker service names (e.g. http://api:4000) must NEVER appear here.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ml:
    container_name: ananya-ml
    restart: unless-stopped
    profiles:
      - ml
      - all
    ports:
      - "${ML_PORT:-5001}:5001"
    environment:
      PORT: 5001
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ananya-pgadmin
    restart: unless-stopped
    profiles:
      - tools
      - admin
      - all
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ananya.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ananya_dbadmin:/var/lib/pgadmin
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  ananya_db:
  ananya_app:
  ananya_dbadmin:

networks:
  internal:
    name: ananya_internal
    driver: bridge
