name: Docker Container Build & Publish

on:
  push:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality-gates:
    name: Mandatory Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Audit
        run: pnpm lint

      - name: Run TypeScript Type Check
        run: pnpm check-types

      - name: Run Test Suite
        run: pnpm test

      - name: Run Production Build Validation
        run: pnpm build

  smoke-test:
    name: Production Stack Docker Integration Test
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot Infrastructure Services (PostgreSQL & Redis)
        run: |
          echo "=== 1. Starting PostgreSQL & Redis ==="
          docker compose -f compose.prod.yaml up -d postgres redis

          echo "=== 2. Waiting for PostgreSQL & Redis Readiness ==="
          for i in {1..30}; do
            if docker compose -f compose.prod.yaml exec -T postgres pg_isready -U ananya -d ananya 2>/dev/null; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 2
          done

          for i in {1..30}; do
            if docker compose -f compose.prod.yaml exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis is ready!"
              break
            fi
            echo "Waiting for Redis ($i/30)..."
            sleep 2
          done

      - name: Run Database Setup & Migrations
        run: |
          echo "=== 3. Executing Database Migrations ==="
          DATABASE_URL="postgres://ananya:ananya_secure_password@localhost:5432/ananya" pnpm --filter @ananya/database db:setup

      - name: Boot Application Stack & Run Health Checks
        run: |
          echo "=== 4. Booting Application Stack (API, Worker, Web) ==="
          docker compose -f compose.prod.yaml up --build -d api worker web

          echo "=== 5. Container Status (docker compose ps -a) ==="
          docker compose -f compose.prod.yaml ps -a

          echo "=== 6. Waiting 5s for process initialization ==="
          sleep 5

          echo "=== 7. Checking Service Exit States ==="
          containers=("ananya-postgres" "ananya-redis" "ananya-api" "ananya-worker" "ananya-web")
          for c in "${containers[@]}"; do
            running=$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo "false")
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo "1")
            echo "Container '$c' -> Running: $running, ExitCode: $exit_code"

            if [ "$running" != "true" ]; then
              echo "❌ CONTAINER FAILURE: '$c' exited prematurely with exit code $exit_code!"
              echo "--- Container Logs for '$c' ---"
              docker logs "$c"
              echo "--------------------------------"
              exit 1
            fi
          done

          echo "=== 8. Health Probes Verification ==="
          echo "Probing API Health (http://localhost:4000/health)..."
          if ! curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:4000/health; then
            echo "❌ API Health Probe Failed! Logs:"
            docker logs ananya-api
            exit 1
          fi

          echo "Probing Worker Health (http://localhost:4001/health)..."
          if ! curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:4001/health; then
            echo "❌ Worker Health Probe Failed! Logs:"
            docker logs ananya-worker
            exit 1
          fi

          echo "Probing Web Health (http://localhost:3000/api/health)..."
          if ! curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health; then
            echo "❌ Web Health Probe Failed! Logs:"
            docker logs ananya-web
            exit 1
          fi

          echo "✅ Full production integration smoke test passed cleanly!"

      - name: Cleanup Production Stack
        if: always()
        run: |
          docker compose -f compose.prod.yaml down -v --remove-orphans || true

  build-and-publish:
    name: Build & Publish Image (${{ matrix.service }})
    needs: [quality-gates, smoke-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: ghcr.io/48studios/ananya-api
            dockerfile: docker/Dockerfile.api
          - service: web
            image: ghcr.io/48studios/ananya-web
            dockerfile: docker/Dockerfile.web
          - service: worker
            image: ghcr.io/48studios/ananya-worker
            dockerfile: docker/Dockerfile.worker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & OCI Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
          labels: |
            org.opencontainers.image.title=Ananya ERP ${{ matrix.service }}
            org.opencontainers.image.description=Production container image for Ananya ERP platform (${{ matrix.service }})
            org.opencontainers.image.vendor=48 Studios
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/48studios/ananya#readme
            org.opencontainers.image.source=https://github.com/48studios/ananya

      - name: Build & Push Multi-Architecture Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

