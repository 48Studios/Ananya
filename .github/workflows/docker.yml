name: Docker Container Build & Publish

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The calling job keeps the "Production Stack Docker Integration Test" name.
  smoke-test:
    name: Production Stack Docker Integration Test
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/_docker-smoke-test.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      compose_profile: all
      verify_ml: true

  build-and-publish:
    name: Build & Publish Image (${{ matrix.service }})
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: ghcr.io/48studios/ananya-api
            dockerfile: docker/Dockerfile.api
          - service: web
            image: ghcr.io/48studios/ananya-web
            dockerfile: docker/Dockerfile.web
          - service: worker
            image: ghcr.io/48studios/ananya-worker
            dockerfile: docker/Dockerfile.worker
          - service: ml
            image: ghcr.io/48studios/ananya-ml
            dockerfile: docker/Dockerfile.ml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & OCI Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Ananya ERP ${{ matrix.service }}
            org.opencontainers.image.description=Production container image for Ananya ERP platform (${{ matrix.service }})
            org.opencontainers.image.vendor=48 Studios
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/48studios/ananya#readme
            org.opencontainers.image.source=https://github.com/48studios/ananya

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate Image Publish Summary
        if: always()
        run: |
          echo "## 📦 Published Container Image (${{ matrix.service }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags**:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
