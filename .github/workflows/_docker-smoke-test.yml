# ==============================================================================
# Reusable workflow: Production Stack Docker Smoke Test
#
# Boots the production-equivalent compose stack from source, waits for its
# configured health checks, and always tears the stack down again.
#
# Called by:
#   - docker.yml  (worker and ML profiles, ML container verified)
#   - release.yml (worker profile)
#
# No Node/pnpm setup is required: every image is built inside Docker, so the
# runner only needs the Docker daemon it already ships with.
#
# Deliberately NOT declared here: `concurrency` (see _quality-gates.yml).
# ==============================================================================
name: Docker Smoke Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test. Defaults to the caller's ref.
        required: false
        type: string
        default: ""
      compose_profiles:
        description: Comma-separated Compose profiles to activate.
        required: false
        type: string
        default: worker
      verify_ml:
        description: Also require the ananya-ml container to stay up and answer its health probe.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run Smoke Test
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: ${{ inputs.compose_profiles }}
      VERIFY_ML: ${{ inputs.verify_ml }}
      POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: ci-only-${{ github.sha }}-smoke-test-secret
      PGADMIN_DEFAULT_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Boot Production Application Stack & Run Health Checks
        id: smoke_test
        run: |
          set -euo pipefail

          compose() {
            docker compose -f compose.yml -f compose.local.yml "$@"
          }

          build_services=(api migrate web worker)
          if [ "$VERIFY_ML" = "true" ]; then
            build_services+=(ml)
          fi

          compose build "${build_services[@]}"
          compose up -d db
          compose run --rm migrate
          compose up -d --wait --wait-timeout 240

          # Compose health checks run inside each container/network. This is
          # important for ML, which deliberately has no host-published port.
          containers=(ananya-db ananya-api ananya-worker ananya-web)
          if [ "$VERIFY_ML" = "true" ]; then
            containers+=(ananya-ml)
          fi

          for c in "${containers[@]}"; do
            health=$(docker inspect -f '{{.State.Health.Status}}' "$c")
            if [ "$health" != "healthy" ]; then
              echo "Container '$c' is '$health', expected 'healthy'." >&2
              exit 1
            fi
          done

          # Also verify the two public ports from the runner, without dumping
          # JSON response bodies into the Actions log.
          for url in http://localhost:3000/api/health http://localhost:4000/health; do
            curl --silent --show-error --fail --output /dev/null \
              --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
              "$url"
          done

      - name: Generate Smoke Test Summary
        if: always()
        run: |
          echo "## 🐳 Docker Smoke Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Profiles: \`${{ inputs.compose_profiles }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ steps.smoke_test.outcome == 'success' && 'Passed' || 'Failed' }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Container Diagnostic Logs on Failure
        if: failure()
        run: |
          docker compose -f compose.yml -f compose.local.yml \
            ps -a
          docker compose -f compose.yml -f compose.local.yml \
            logs --no-color --tail=100 || true

      - name: Cleanup Production Stack
        if: always()
        run: |
          docker compose -f compose.yml -f compose.local.yml down -v --remove-orphans || true
