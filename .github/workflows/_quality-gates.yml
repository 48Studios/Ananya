# ==============================================================================
# Reusable workflow: Monorepo Quality Gates
#
# Single definition of the mandatory pre-merge / pre-release gate suite:
# dependency install, ESLint, TypeScript, unit tests and the production build.
#
# Called by:
#   - ci.yml      (push to main, pull requests)
#   - release.yml (tag push)
#
# Deliberately NOT declared here:
#   - `concurrency`: a called workflow shares `github.workflow` with its caller,
#     so an identical group would cancel the caller mid-run.
# ==============================================================================
name: Quality Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Restore Turborepo & Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Audit
        id: lint
        run: pnpm turbo run lint --output-logs=new-only --log-order=grouped

      - name: Run TypeScript Type Check
        id: check_types
        run: pnpm turbo run check-types --output-logs=new-only --log-order=grouped

      - name: Run Production Build Validation
        id: build
        run: pnpm turbo run build --output-logs=new-only --log-order=grouped

      - name: Run Test Suite
        id: test
        run: pnpm turbo run test --output-logs=new-only --log-order=grouped

      - name: Generate Quality Gates Summary
        if: always()
        run: |
          echo "## 🛡️ Monorepo Quality Gates Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ESLint Audit | ${{ steps.lint.outcome == 'success' && '✅ Passed' || (steps.lint.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript Type Check | ${{ steps.check_types.outcome == 'success' && '✅ Passed' || (steps.check_types.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production Build Validation | ${{ steps.build.outcome == 'success' && '✅ Passed' || (steps.build.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Suite | ${{ steps.test.outcome == 'success' && '✅ Passed' || (steps.test.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> "$GITHUB_STEP_SUMMARY"
