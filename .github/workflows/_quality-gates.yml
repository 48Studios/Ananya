# ==============================================================================
# Reusable workflow: Monorepo Quality Gates
#
# Single definition of the mandatory pre-merge / pre-release gate suite:
# dependency install, ESLint, TypeScript, unit tests and the production build.
#
# Called by:
#   - ci.yml      (push to main, pull requests)
#   - release.yml (tag push)
#
# Deliberately NOT declared here:
#   - `concurrency`: a called workflow shares `github.workflow` with its caller,
#     so an identical group would cancel the caller mid-run.
# ==============================================================================
name: Quality Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Audit
        run: pnpm lint

      - name: Run TypeScript Type Check
        run: pnpm check-types

      - name: Run Test Suite
        run: pnpm test

      - name: Run Production Build Validation
        run: pnpm build
