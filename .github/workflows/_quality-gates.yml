# ==============================================================================
# Reusable workflow: Monorepo Quality Gates
#
# Single definition of the mandatory pre-merge / pre-release gate suite:
# dependency install, ESLint, TypeScript, unit tests and the production build.
#
# Called by:
#   - ci.yml      (push to main, pull requests)
#   - release.yml (tag push)
#
# Deliberately NOT declared here:
#   - `concurrency`: a called workflow shares `github.workflow` with its caller,
#     so an identical group would cancel the caller mid-run.
# ==============================================================================
name: Quality Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    # The @ananya/database schema suite asserts real PostgreSQL referential
    # integrity (restrict/cascade foreign keys, partial unique indexes), so the
    # gate needs a live database with every migration applied. The credentials
    # are ephemeral to this job's service container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ananya
          POSTGRES_PASSWORD: ananya
          POSTGRES_DB: ananya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ananya -d ananya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ananya:ananya@localhost:5432/ananya

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Restore Turborepo & Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Database Migrations
        run: pnpm db:migrate

      - name: Lint & Type Check
        run: >-
          pnpm turbo run lint check-types
          --output-logs=errors-only
          --log-order=grouped

      - name: Build & Test
        run: >-
          pnpm turbo run build test
          --output-logs=errors-only
          --log-order=grouped
