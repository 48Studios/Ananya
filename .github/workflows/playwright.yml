name: Playwright E2E Quality Gate (Manual)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional path or pattern for Playwright spec (e.g. tests/e2e/import-export/)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Application Standalone Assets
        run: pnpm build

      - name: Run Playwright E2E Tests
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            pnpm exec playwright test ${{ github.event.inputs.spec }}
          else
            pnpm test:e2e
          fi

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retrieval-days: 7
