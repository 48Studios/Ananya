name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  quality-gates:
    name: Mandatory Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Audit
        run: pnpm lint

      - name: Run TypeScript Type Check
        run: pnpm check-types

      - name: Run Test Suite
        run: pnpm test

      - name: Run Production Build Validation
        run: pnpm build

  smoke-test:
    name: Production Stack Docker Integration Test
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot Production Application Stack & Run Health Checks
        run: |
          echo "=== 1. Booting Production Stack via Standalone compose.prod.yml ==="
          docker compose -f compose.prod.yml --profile worker up --build -d

          echo "=== 2. Container Status (docker compose ps -a) ==="
          docker compose -f compose.prod.yml --profile worker ps -a

          echo "=== 3. Waiting 5s for process initialization ==="
          sleep 5

          echo "=== 4. Checking Service Exit States ==="
          containers=("ananya-postgres" "ananya-api" "ananya-worker" "ananya-web")
          for c in "${containers[@]}"; do
            running=$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo "false")
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo "1")
            echo "Container '$c' -> Running: $running, ExitCode: $exit_code"

            if [ "$running" != "true" ]; then
              echo "❌ CONTAINER FAILURE: '$c' exited prematurely with exit code $exit_code!"
              echo "--- Container Logs for '$c' ---"
              docker logs "$c"
              echo "--------------------------------"
              exit 1
            fi
          done

          echo "=== 5. Health Probes Verification ==="
          echo "Probing Web Health (http://localhost:3000/api/health)..."
          if ! curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health; then
            echo "❌ Web Health Probe Failed! Logs:"
            docker logs ananya-web
            exit 1
          fi

          echo "Probing API Internal Health..."
          if ! docker exec ananya-api node -e "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"; then
            echo "❌ API Health Probe Failed! Logs:"
            docker logs ananya-api
            exit 1
          fi

          echo "Probing Worker Internal Health..."
          if ! docker exec ananya-worker node -e "fetch('http://localhost:4001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"; then
            echo "❌ Worker Health Probe Failed! Logs:"
            docker logs ananya-worker
            exit 1
          fi

          echo "✅ Standalone production deployment integration smoke test passed cleanly!"

      - name: Cleanup Production Stack
        if: always()
        run: |
          docker compose -f compose.prod.yml --profile worker down -v --remove-orphans || true

  publish-release-images:
    name: Build & Publish Release Image (${{ matrix.service }})
    needs: [quality-gates, smoke-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: ghcr.io/48studios/ananya-api
            dockerfile: docker/Dockerfile.api
          - service: web
            image: ghcr.io/48studios/ananya-web
            dockerfile: docker/Dockerfile.web
          - service: worker
            image: ghcr.io/48studios/ananya-worker
            dockerfile: docker/Dockerfile.worker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Version Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

          flavor: |
            latest=false

          tags: |
            # Stable releases
            type=semver,pattern={{version}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            # Release candidates
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-RC') || contains(github.ref_name, '-rc') }}
            type=raw,value=${{ github.ref_name }},enable=${{ contains(github.ref_name, '-RC') || contains(github.ref_name, '-rc') }}

          labels: |
            org.opencontainers.image.title=Ananya ERP ${{ matrix.service }}
            org.opencontainers.image.description=Production release image for Ananya ERP platform (${{ matrix.service }})
            org.opencontainers.image.vendor=48 Studios
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/48studios/ananya#readme
            org.opencontainers.image.source=https://github.com/48studios/ananya

      - name: Inspect Metadata Outputs
        run: |
          echo "=== steps.meta.outputs.tags ==="
          echo "${{ steps.meta.outputs.tags }}"
          echo "=== steps.meta.outputs.version ==="
          echo "${{ steps.meta.outputs.version }}"
          echo "=== steps.meta.outputs.json ==="
          echo "${{ steps.meta.outputs.json }}"

      - name: Build & Push Release Multi-Architecture Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  create-github-release:
    name: Create GitHub Release
    needs: publish-release-images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ananya ERP Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
