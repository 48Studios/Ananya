name: Production Release Pipeline

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Monorepo Quality Gates
    permissions:
      contents: read
    uses: ./.github/workflows/_quality-gates.yml

  smoke-test:
    name: Production Stack Docker Integration Test
    needs: quality-gates
    permissions:
      contents: read
    uses: ./.github/workflows/_docker-smoke-test.yml
    with:
      compose_profile: worker

  publish-release-images:
    name: Build & Publish Release Image (${{ matrix.service }})
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: ghcr.io/48studios/ananya-api
            dockerfile: docker/Dockerfile.api
          - service: web
            image: ghcr.io/48studios/ananya-web
            dockerfile: docker/Dockerfile.web
          - service: worker
            image: ghcr.io/48studios/ananya-worker
            dockerfile: docker/Dockerfile.worker
          - service: ml
            image: ghcr.io/48studios/ananya-ml
            dockerfile: docker/Dockerfile.ml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Release Docker Tags
        id: compute_tags
        run: |
          REF_NAME="${{ github.ref_name }}"
          IMAGE="${{ matrix.image }}"
          TAG_NAME="${REF_NAME#v}"

          TAGS=()
          if [[ "$TAG_NAME" == *"-"* ]]; then
            TAGS+=("${IMAGE}:${TAG_NAME}")
            PRE="${TAG_NAME#*-}"
            PRE_LOWER=$(echo "$PRE" | tr '[:upper:]' '[:lower:]')
            CHANNEL=$(echo "$PRE_LOWER" | sed -E 's/^([a-z]+).*/\1/')
            TAGS+=("${IMAGE}:${CHANNEL}")
          else
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:${TAG_NAME}")
            MAJOR=$(echo "$TAG_NAME" | cut -d. -f1)
            MINOR=$(echo "$TAG_NAME" | cut -d. -f2)
            TAGS+=("${IMAGE}:${MAJOR}.${MINOR}")
            if [ "$MAJOR" -ge 1 ] 2>/dev/null; then
              TAGS+=("${IMAGE}:${MAJOR}")
            fi
          fi

          {
            echo "tags<<EOF"
            printf "%s\n" "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "=== Computed Docker Tags ==="
          printf '%s\n' "${TAGS[@]}"

      - name: Extract OCI Image Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=Ananya ERP ${{ matrix.service }}
            org.opencontainers.image.description=Production release image for Ananya ERP platform (${{ matrix.service }})
            org.opencontainers.image.vendor=48 Studios
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/48studios/ananya#readme
            org.opencontainers.image.source=https://github.com/48studios/ananya

      - name: Build & Push Release Multi-Architecture Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.compute_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate Release Image Summary
        if: always()
        run: |
          echo "## 📦 Published Release Container Image (${{ matrix.service }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platforms**: \`linux/amd64,linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags**:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.compute_tags.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create-github-release:
    name: Create GitHub Release
    needs: publish-release-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release with Notes
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ananya ERP Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Summary
        if: always()
        run: |
          echo "## 🚀 GitHub Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag / Release**: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pre-release**: \`${{ contains(github.ref_name, '-') }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.release.outcome == 'success' && '✅ Published' || '❌ Failed' }}" >> "$GITHUB_STEP_SUMMARY"
