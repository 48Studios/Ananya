name: Continuous Integration

# NOTE: docker.yml subscribes to this workflow by name through workflow_run.
# Renaming it silently stops container image publishing from main.

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:
    branches:
      - main
      - "release/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The calling job keeps the "Monorepo Quality Gates" name because pull
  # request status checks are matched on it.
  quality-gates:
    name: Monorepo Quality Gates
    permissions:
      contents: read
    uses: ./.github/workflows/_quality-gates.yml
