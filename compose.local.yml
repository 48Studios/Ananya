# ==============================================================================
# Ananya ERP — Local Build Override (compose.local.yml)
# Provides build directives for all application services.
# Use with compose.yml to test production Dockerfiles locally without GHCR:
#
#   docker compose -f compose.yml -f compose.local.yml up --build
#
# API_PUBLIC_URL must be a URL the browser can reach directly.
# Use localhost (not Docker service names) for browser-facing config.
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      # Browser-accessible API URL for local Docker builds.
      # The browser hits this URL directly — no Next.js proxy.
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
